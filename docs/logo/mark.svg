<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="crust">
  <!-- The mark is a page seen in section: a solid crust laid over the body it
       covers, with a gap between them. Three corners break clean; the lower-left
       carries the rim, so the form reads as a piece of something larger rather
       than a self-contained tile.

       Ink follows the surface it sits on — #111 on light, white on dark — so it
       never sinks into the background. Use light.svg / dark.svg where the theme
       is decided by the page rather than the reader's OS (see those files). -->
  <style>
    .ink { fill: #111111; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #ffffff; }
    }
  </style>
  <path class="ink" d="M26 5v5H6V5h20Z"/>
  <path class="ink" d="M26 12.5V27H13a7 7 0 0 1-7-7V12.5h20Z"/>
</svg>
