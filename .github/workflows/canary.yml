name: Next canary

# Manifest shapes, flight payload format and artifact locations are undocumented
# and move on minor releases (R3). Learning about it here rather than from a user
# issue is the difference between a project that feels alive and one that feels
# dead - so this failing is expected sometimes, and is the point.
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  canary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter crust-fixture-basic add next@canary
      - run: pnpm --filter crust-fixture-basic exec next build --webpack
      - run: CRUST_FIXTURE_MODE=cc pnpm --filter crust-fixture-basic exec next build --webpack
      - run: CRUST_FIXTURE_MODE=turbo pnpm --filter crust-fixture-basic exec next build --turbopack
      - run: node dist/cli.js analyze --cwd fixtures/basic --dist-dir .next-cc --no-save
      - run: node dist/cli.js analyze --cwd fixtures/basic --dist-dir .next-turbo --no-save

      # Instant Navigations separately, because what it depends on is different in
      # kind: not manifest shapes but the names of two segment exports and one
      # config key. A rename lands as a silently empty `route.config` - a detector
      # that stops firing rather than one that starts failing - so the assertion is
      # that the values still come back, not merely that analyze exits 0.
      - run: pnpm --filter crust-fixture-instant add next@canary
      - run: pnpm --filter crust-fixture-instant exec next build --webpack
      - run: pnpm exec vitest run test/compat.test.ts -t 'instant navigations'
