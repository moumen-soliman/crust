name: Release

# Cut a release by pushing a tag; see CONTRIBUTING.md#releasing.
#
#   pnpm version minor && git push --follow-tags
#
# The tag is the trigger and the only input. The published version is taken from
# the tag and written into package.json here, so the two cannot disagree - there
# is no manual bump to forget, and no mismatch to fail on. The release notes come
# from the CHANGELOG in the commit the tag points at, so a release cannot
# describe something other than what shipped.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

# Publishing is not undoable. One release at a time, and never cancel one
# half-way: an interrupted job can leave npm published and the GitHub release
# missing, which is the awkward half to repair by hand.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write # create the GitHub release
      id-token: write # OIDC, for npm provenance

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # release notes and provenance want real history

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # The tag is the single source of the released version. Validated here so a
      # malformed tag fails in seconds, and applied to package.json further down
      # - after install, before anything is built from it.
      - name: Resolve the version from the tag
        id: version
        run: |
          tag="${GITHUB_REF_NAME}"
          case "$tag" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::'$tag' is not a vX.Y.Z tag. Dispatch this workflow against a tag."; exit 1 ;;
          esac

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      # Extracted before anything is built, so a missing entry fails in seconds
      # rather than after the test suite. An unwritten changelog is a release
      # nobody can read: for a tool whose whole value is comparison over time,
      # "what changed" is the product, not paperwork.
      - name: Extract the release notes
        run: |
          awk -v v="${{ steps.version.outputs.version }}" '
            $0 ~ "^## \\[" v "\\]" { inside = 1; next }
            inside && /^## / { exit }
            inside { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"

          if [ ! -s "$RUNNER_TEMP/notes.md" ]; then
            echo "::error::CHANGELOG.md has no '## [${{ steps.version.outputs.version }}]' section."
            echo "::error::Rename the Unreleased heading to that version before tagging."
            exit 1
          fi
          cat "$RUNNER_TEMP/notes.md"

      - run: pnpm install --frozen-lockfile

      # After install so the lockfile check sees the committed manifest, and
      # before any build so the version tsup inlines into src/version.ts is the
      # one being published. `--allow-same-version` keeps this a no-op in the
      # normal case, where `pnpm version` already wrote it locally; it only does
      # real work when a tag was cut by hand. Not committed back - the tag is the
      # record, and a release job that pushes to master is a release job that
      # fails on a protected branch.
      - name: Set the package version from the tag
        run: |
          npm version "${{ steps.version.outputs.version }}" \
            --no-git-tag-version --allow-same-version
          node -p "'publishing ' + require('./package.json').name + '@' + require('./package.json').version"

      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      # Same check the `package` CI job runs. Repeated here because this is the
      # last moment a broken manifest is still fixable.
      - name: Smoke-test the tarball as a consumer
        run: |
          pnpm pack --pack-destination "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/consumer"
          npm init -y --prefix "$RUNNER_TEMP/consumer" >/dev/null
          npm install --no-audit --no-fund \
            --prefix "$RUNNER_TEMP/consumer" \
            "$RUNNER_TEMP"/moumensoliman-crust-*.tgz

          CRUST="$RUNNER_TEMP/consumer/node_modules/.bin/crust"
          actual=$("$CRUST" --version)
          echo "$actual"
          case "$actual" in
            "crust/${{ steps.version.outputs.version }} "*) ;;
            *) echo "::error::installed executable reports: $actual"; exit 1 ;;
          esac

      # Provenance links this tarball to this workflow run and this commit, so
      # anyone can verify what source produced the package they installed.
      # Requires the id-token permission above and a public repository.
      - name: Publish to npm with provenance
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "${{ steps.version.outputs.tag }}" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --verify-tag
